services:
  - type: web
    name: ai-detection
    runtime: node
    repo: https://github.com/unius723/ai-detection
    branch: main
    region: singapore
    plan: free
    numInstances: 1
    buildCommand: npm install --omit=dev && npm run check
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      - key: BIND_HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/ai-detection-data
      - key: ADMIN_PASSWORD
        generateValue: true
